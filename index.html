<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e20074">
<meta name="application-name" content="DATABAU Academy">
<meta name="apple-mobile-web-app-title" content="Academy">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="DATABAU Academy – das Feldbuch für den Außendienst">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>DATABAU Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: mobile-first field tool — sticky header, single content column, fixed bottom tab bar. DATABAU black/white, Telekom magenta for actions. */
:root{
  --bg:#f3f3f5; --surface:#ffffff; --surface-2:#e9e9ee; --line:#d6d6de;
  --fg:#111114; --muted:#5c5c68; --accent:#e20074; --accent-ink:#c4005f; --accent-soft:#fde6f1; --on-accent:#ffffff; --logo-filter:none;
  --ok:#2f7d4f; --ok-soft:#e1f1e7; --bad:#b3362b; --bad-soft:#f8e1de; --warn:#9a6a00; --warn-soft:#fbf0d2;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d0d10; --surface:#18181d; --surface-2:#232329; --line:#33333b;
  --fg:#f1f1f4; --muted:#a2a2ae; --accent:#e20074; --accent-ink:#ff5aa8; --accent-soft:#3b0f24; --on-accent:#ffffff; --logo-filter:invert(1);
  --ok:#5cc189; --ok-soft:#173326; --bad:#ef7b6f; --bad-soft:#3c1c19; --warn:#e5b54a; --warn-soft:#3a2f12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0d10; --surface:#18181d; --surface-2:#232329; --line:#33333b;
  --fg:#f1f1f4; --muted:#a2a2ae; --accent:#e20074; --accent-ink:#ff5aa8; --accent-soft:#3b0f24; --on-accent:#ffffff; --logo-filter:invert(1);
  --ok:#5cc189; --ok-soft:#173326; --bad:#ef7b6f; --bad-soft:#3c1c19; --warn:#e5b54a; --warn-soft:#3a2f12; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.hwrap,.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hwrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark{width:34px;height:34px;flex:none;filter:var(--logo-filter)}
.logo b{font-family:var(--f-display);font-size:21px;letter-spacing:.06em;line-height:1;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.logo b span{font-weight:600;color:var(--muted)}
.logo small{display:block;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo>div{min-width:0}
.hbtn{background:var(--surface-2);border:0;border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer;flex:none;display:flex;align-items:center;gap:6px}
.hbtn.admin{background:var(--fg);color:var(--bg)}

.wrap{padding-block:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:30px} h2{font-size:22px} h3{font-size:19px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.muted{color:var(--muted)}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
.sec{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.sec:first-child{margin-top:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.note{background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:14px;display:flex;gap:10px}
.note b{color:var(--warn)}

.search{position:relative}
.search input{width:100%;font-size:17px;padding:13px 14px 13px 42px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.search input:focus{border-color:var(--accent);outline:none}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;text-decoration:none;color:inherit}
.tile:hover{border-color:var(--accent)}
.tile .k{font-family:var(--f-display);font-size:19px}
.tile .d{font-size:13px;color:var(--muted)}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%;color:inherit;text-decoration:none}
.list>.row:first-child,.list>:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600}
.row .t span{display:block;font-size:14px;color:var(--muted)}
.chev{color:var(--muted);flex:none}
.chip{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);flex:none;white-space:nowrap}
.chip.c{background:var(--accent-soft);color:var(--accent-ink)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}

.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{position:relative;padding:0 0 18px 44px;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-family:var(--f-display);font-size:17px;display:grid;place-items:center}
.steps li::after{content:"";position:absolute;left:14px;top:32px;bottom:2px;width:2px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps b{display:block}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.box ul{margin:6px 0 0;padding-left:20px}
.box.warn{border-color:transparent;background:var(--bad-soft)}
.box.warn h3{color:var(--bad)}
.vrow{flex-direction:column;align-items:flex-start;gap:4px;cursor:default}
.vrow .val{white-space:normal;font-family:var(--f-body);font-size:15px;padding:2px 8px}
.val{font-family:var(--f-mono);font-size:14px;background:var(--surface-2);padding:1px 6px;border-radius:5px;font-variant-numeric:tabular-nums;white-space:nowrap}

.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.gallery button{padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:zoom-in;background:#fff;aspect-ratio:16/9;max-width:100%}
.gallery img{width:100%;height:100%;object-fit:contain;display:block}

.doccard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0;text-decoration:none;color:inherit;cursor:pointer;padding:0;text-align:left}
.doccard:hover{border-color:var(--accent)}
.doccard .thumb{aspect-ratio:16/10;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);max-width:100%;overflow:hidden;position:relative}
.doccard .thumb .fbadge{position:absolute;left:8px;bottom:8px;background:var(--accent);color:var(--on-accent);font-family:var(--f-mono);font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px}
.doccard .thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.doccard .thumb .ftype{font-family:var(--f-mono);font-size:13px;border:1.5px solid currentColor;border-radius:6px;padding:6px 10px}
.doccard .meta{padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.doccard .meta b{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.doccard .meta span{font-size:13px;color:var(--muted)}

.check{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-top:1px solid var(--line);cursor:pointer}
.check:first-child{border-top:0}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:1px 0 0}
.check.done span{color:var(--muted);text-decoration:line-through}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--on-accent);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap}

.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--bad-soft)}
.fb b{display:block}
.score{font-family:var(--f-display);font-size:56px;line-height:1;font-variant-numeric:tabular-nums}

.gl{padding:13px 14px;border-top:1px solid var(--line)}
.gl:first-child{border-top:0}
.gl .term{font-family:var(--f-mono);font-weight:500;color:var(--accent-ink)}
.gl .long{font-weight:600}
.gl p{margin-top:4px;font-size:15px;color:var(--muted)}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.empty{padding:22px 14px;text-align:center;color:var(--muted)}

/* Admin forms */
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.field small{font-size:12.5px;color:var(--muted)}
.in{width:100%;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;font-size:16px}
.in:focus{border-color:var(--accent);outline:none}
textarea.in{min-height:92px;resize:vertical;line-height:1.45}
.fgroup{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.item{border:1px dashed var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.itemhead{display:flex;align-items:center;gap:6px}
.itemhead b{flex:1;font-family:var(--f-display);font-size:16px}
.ib{border:0;background:var(--surface-2);border-radius:7px;width:32px;height:32px;cursor:pointer;display:grid;place-items:center;flex:none}
.ib.del{color:var(--bad)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.optrow{display:flex;align-items:center;gap:8px}
.optrow input[type=radio]{width:20px;height:20px;accent-color:var(--ok);flex:none}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs figure{margin:0;position:relative;width:96px;height:72px;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs .ib{position:absolute;top:4px;right:4px;width:26px;height:26px;background:var(--surface)}
.upl{display:inline-flex}
.upl input{position:absolute;width:1px;height:1px;opacity:0}
.toggle{display:flex;align-items:center;gap:10px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.adminrow{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 14px;border-top:1px solid var(--line)}
.adminrow:first-child{border-top:0}
.adminrow .t{flex:1;min-width:0;cursor:pointer;padding-block:4px}
.adminrow .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.adminrow .t span{display:block;font-size:13px;color:var(--muted)}
.adminrow .t b .chip{display:inline-block;vertical-align:2px;margin-left:6px;font-size:10px}
@media (max-width:480px){.two{grid-template-columns:minmax(0,1fr)}}
.savebar{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.savebar .grow{flex:1}

.lightbox{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.lightbox img{max-width:100%;max-height:85vh;object-fit:contain;border-radius:6px}
.lightbox p{color:#fff;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);z-index:21;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;max-width:calc(100% - 32px)}
.toast.err{background:var(--bad);color:#fff}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .inner{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:600;min-width:0}
nav.tabs a[aria-current="page"]{color:var(--accent-ink)}
nav.tabs a[aria-current="page"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
nav.tabs svg{width:22px;height:22px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>

  <a href="#unterlagen" data-tab="unterlagen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>Unterlagen</a>
  <a href="#checklisten" data-tab="checklisten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 9l2 2 4-4M8 16h8"/></svg>Checklisten</a>
  <a href="#schulung" data-tab="schulung"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/></svg>Schulung</a>
</div></nav>

<script>document.write('<script src="config.js?v='+Date.now()+'"><\/script>')</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ============ State ============ */
const COLS=["articles","checklists","courses","glossary","docs"];
const CAP={assets:false};
const S={articles:[],checklists:[],courses:[],glossary:[],docs:[],settings:{cats:[],docCats:[]},
  loaded:{},state:"loading",canEdit:false,uid:null,progress:{cl:{},courses:{}},me:null,users:[],files:{}};
let loginStep={email:"",admin:false,busy:false,err:""}, udel=null, qdel=null;
let detail=null, quiz=null, draft=null, pendingRefresh=false;
let wissenFilter="alle", wissenQuery="", docFilter="alle", docQuery="";

const $app=document.getElementById("app"), $back=document.getElementById("back"), $adminBtn=document.getElementById("adminBtn"), $ov=document.getElementById("overlay");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const chev='<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>';
const icoSearch='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
const byOrder=(a,b)=>(a.order??1e9)-(b.order??1e9)||String(a.title||a.term||"").localeCompare(String(b.title||b.term||""),"de");
const blob=id=>(S.files&&S.files[id])||"data:image/gif;base64,R0lGODlhAQABAAAAACw=";
const catName=(id)=>(S.settings.cats||[]).find(c=>c.id===id)?.name||"Allgemein";
const docCatName=(id)=>(S.settings.docCats||[]).find(c=>c.id===id)?.name||"Sonstiges";
const slug=s=>String(s).toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"k";
const fmtSize=b=>b>1048576?(b/1048576).toFixed(1).replace(".",",")+" MB":Math.max(1,Math.round(b/1024))+" KB";
function toast(msg,err){const t=document.createElement("div");t.className="toast"+(err?" err":"");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),err?4500:2200)}

/* ============ Server ============ */
const API=String(window.FELDBUCH_API||"").replace(/\/+$/,"");
const session={get(){try{return localStorage.getItem("fbk_session")||""}catch(e){return mem.t||""}},set(t){mem.t=t;try{t?localStorage.setItem("fbk_session",t):localStorage.removeItem("fbk_session")}catch(e){}}};
const mem={};
async function api(path,opts={}){
  if(!API||API.includes("DEIN-PROJEKT")){const err=new Error("Die App ist noch nicht eingerichtet: Bitte in config.js die Adresse der Supabase-Funktion eintragen.");err.status=0;throw err}
  const headers={};if(opts.body)headers["Content-Type"]="application/json";const t=session.get();if(t)headers["x-session"]=t;
  let r;
  try{r=await fetch(API+path.replace(/^\/api/,""),{method:opts.method||"GET",headers,body:opts.body?JSON.stringify(opts.body):undefined})}
  catch(e){throw new Error("Keine Verbindung zum Server. Prüfe dein Netz und versuche es erneut.")}
  let j=null;try{j=await r.json()}catch(e){}
  if(r.status===401&&!opts.noAuthRedirect){session.set("");S.me=null;S.state="login";detail=null;render()}
  if(!r.ok){const err=new Error((j&&j.error)||"Etwas ist schiefgelaufen. Bitte erneut versuchen.");err.status=r.status;throw err}
  return j;
}

/* ============ Fortschritt (pro Mitarbeiter) ============ */
const local={get(k,d){try{const v=localStorage.getItem("fbk_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("fbk_"+k,JSON.stringify(v))}catch(e){}}};
let progTimer=null;
function saveProgress(){
  clearTimeout(progTimer);
  progTimer=setTimeout(async()=>{
    local.set("progress",S.progress);
    try{await api("/api/progress",{method:"PUT",body:S.progress})}catch(e){}
  },500);
}
function clDone(id){return S.progress.cl[id]||[]}
function courseResult(id){return S.progress.courses[id]||null}

/* ============ Anmeldung und Daten ============ */
async function init(){
  render();
  if(!session.get()){S.state="login";render();return}
  try{S.me=await api("/api/me",{noAuthRedirect:true})}catch(e){if(e.status===401)session.set("");else loginStep.err=e.message;S.state="login";render();return}
  await afterLogin();
}
async function afterLogin(){
  S.canEdit=!!S.me.admin;CAP.assets=S.canEdit;
  S.state="loading";render();
  try{const p=await api("/api/progress");S.progress={cl:{...(p.cl||{})},courses:{...(p.courses||{})}}}
  catch(e){S.progress=Object.assign({cl:{},courses:{}},local.get("progress",{}))}
  await loadContent();
  if(S.canEdit)loadUsers();
}
async function loadContent(){
  try{const d=await api("/api/content");COLS.forEach(c=>S[c]=d[c]||[]);S.files=d.files||{};S.settings={cats:[],docCats:[],...(d.settings||{})};S.state="ok"}
  catch(e){if(S.state!=="login")S.state="none"}
  softRender();
}
async function loadUsers(){try{S.users=await api("/api/admin/users")}catch(e){S.users=[]}softRender()}
function softRender(){if(detail&&detail.type==="edit"){pendingRefresh=true;return}render()}
async function doLogin(email,pw){
  loginStep={...loginStep,email,busy:true,err:""};render();
  try{
    const r=await api("/api/login",{method:"POST",body:{email,password:pw||undefined},noAuthRedirect:true});
    if(r.needPassword){loginStep={...loginStep,busy:false,err:"Für dieses Konto bitte den Admin-Zugang nutzen."};render();return}
    session.set(r.token);
    S.me=await api("/api/me",{noAuthRedirect:true});
    loginStep={email:"",admin:false,busy:false,err:""};
    location.hash="start";await afterLogin();
  }catch(e){loginStep={...loginStep,busy:false,err:e.message};render()}
}
async function doLogout(){
  session.set("");
  S.me=null;S.canEdit=false;CAP.assets=false;S.users=[];detail=null;quiz=null;draft=null;S.state="login";render();
}
function vLogin(){
  const l=loginStep;
  return `<div class="sec" style="max-width:440px;margin-inline:auto;padding-top:12px">
    <div class="eyebrow">DATABAU Academy</div><h1>${l.admin?"Admin-Anmeldung":"Anmelden"}</h1>
    <p class="muted">${l.admin?"Anmeldung für die Verwaltung mit E-Mail und Admin-Passwort.":"Melde dich mit deiner geschäftlichen E-Mail-Adresse an."}</p>
    <form id="loginForm" class="form" novalidate>
      <label class="field"><span>E-Mail-Adresse</span><input class="in" id="lg-email" type="email" autocomplete="email" inputmode="email" autocapitalize="off" value="${esc(l.email)}" placeholder="vorname.nachname@firma.de"></label>
      ${l.admin?`<label class="field"><span>Admin-Passwort</span><input class="in" id="lg-pw" type="password" autocomplete="current-password"></label>`:""}
      ${l.err?`<div class="fb no" role="alert">${esc(l.err)}</div>`:""}
      <div><button class="btn" type="submit" ${l.busy?"disabled":""}>${l.busy?"Wird geprüft …":"Anmelden"}</button></div>
    </form>
    ${l.admin?`<p><button class="btn sm ghost" data-normallogin>Zur normalen Anmeldung</button></p>`:`<p class="muted" style="font-size:14px">Kein Zugang? Wende dich an deine Führungskraft.</p>`}</div>`;
}

/* ============ Shared bits ============ */
function articleRow(a){return `<button class="row" data-open="art:${a.id}"><div class="t"><b>${esc(a.title)}</b><span>${esc(a.sum)}</span></div><span class="chip c">${esc(catName(a.cat))}</span>${chev}</button>`}
function glRow(g){return `<div class="gl"><span class="term">${esc(g.term)}</span>${g.long?` <span class="long">${esc(g.long)}</span>`:""}<p>${esc(g.desc)}</p></div>`}
function docCard(d){
  const isImg=(d.type||"").startsWith("image/"), isVid=(d.type||"").startsWith("video/");
  const prev=(d.images||[])[0], badge=isImg?"":`<span class="fbadge">${isVid?"VIDEO":"PDF"}</span>`;
  const thumb=prev?`<img src="${blob(prev)}" alt="" loading="lazy">${badge}`:isImg?`<img src="${blob(d.asset)}" alt="" loading="lazy">`:`<span class="ftype">${isVid?"VIDEO":"PDF"}</span>`;
  const meta=`<div class="meta"><b>${esc(d.title)}</b><span>${esc(docCatName(d.cat))}${d.size?" · "+fmtSize(d.size):""}</span></div>`;
  if(isImg) return `<button class="doccard" data-zoom="${d.asset}" data-cap="${esc(d.title)}"><div class="thumb">${thumb}</div>${meta}</button>`;
  return `<a class="doccard" href="${esc(S.files[d.asset]||"#")}" target="_blank" rel="noopener"><div class="thumb">${thumb}</div>${meta}</a>`;
}
function searchBox(id,ph,val){return `<div class="search">${icoSearch}<input id="${id}" type="search" placeholder="${esc(ph)}" value="${esc(val||"")}" autocomplete="off"></div>`}
function stateGate(){
  if(S.state==="loading") return `<div class="list"><div class="empty">Inhalte werden geladen …</div></div>`;
  if(S.state==="none") return `<div class="note"><b>Hinweis</b><span>Die Inhalte konnten nicht geladen werden. Prüfe deine Verbindung und lade die Seite neu.</span></div>`;
  return null;
}

/* ============ Mitarbeiter-Ansichten ============ */
function vStart(){
  const g=stateGate(); if(g) return `<div class="sec"><div class="eyebrow">DATABAU Academy · Kupfer</div><h1>Was brauchst du gerade?</h1>${g}</div>`;
  const done=S.courses.filter(c=>courseResult(c.id)).length;
  const next=S.courses.find(c=>!courseResult(c.id));
  const featured=S.articles.filter(a=>a.featured);
  return `<div class="sec">
    <div class="eyebrow">DATABAU Academy · Kupfer</div>
    <h1>Was brauchst du gerade?</h1>
    ${searchBox("q-start","z. B. Abmeldung, KVz, Messwerte","")}
  </div>
  <div class="sec"><h2>Schnell nachschlagen</h2>
    <div class="grid2">
      ${S.settings.cats.map(c=>`<button class="tile" data-cat="${c.id}"><span class="k">${esc(c.name)}</span><span class="d">${S.articles.filter(a=>a.cat===c.id).length} Anleitungen</span></button>`).join("")}
      <a class="tile" href="#unterlagen"><span class="k">Unterlagen</span><span class="d">${S.docs.length} PDFs und Bilder</span></a>
      <button class="tile" data-cat="glossar"><span class="k">Abkürzungen</span><span class="d">${S.glossary.length} Begriffe</span></button>
    </div></div>
  ${S.courses.length?`<div class="sec"><h2>Schulung heute Abend</h2>
    <div class="hero">
      <span class="muted">${done} von ${S.courses.length} Lektionen abgeschlossen</span>
      <div class="bar"><i style="width:${done/S.courses.length*100}%"></i></div>
      ${next?`<div><div class="eyebrow">Als Nächstes</div><h3 style="margin-top:4px">${esc(next.title)}</h3><p class="muted" style="margin-top:4px">${esc(next.intro)} · ca. ${esc(next.min||5)} Min</p></div>
      <div class="actions"><button class="btn" data-open="course:${next.id}">Lektion starten</button></div>`
      :`<p>Alle Lektionen abgeschlossen. Stark!</p>`}
    </div></div>`:""}
  ${featured.length?`<div class="sec"><h2>Häufig gebraucht</h2><div class="list">${featured.map(articleRow).join("")}</div></div>`:""}
  ${installPrompt?`<div class="sec"><div class="hero"><b>Als App installieren</b><span class="muted" style="font-size:14px">Dann öffnet sich die Academy wie eine App, ohne Browser-Leisten.</span><div><button class="btn sm" data-install>App installieren</button></div></div></div>`:""}
  <div class="sec"><div class="between"><span class="muted" style="font-size:14px;overflow-wrap:anywhere">Angemeldet als ${esc(S.me?.email)}</span><button class="btn sm ghost" data-logout>Abmelden</button></div></div>`;
}

function vWissen(){
  const g=stateGate(); if(g) return `<div class="sec"><h1>Wissen</h1>${g}</div>`;
  const q=wissenQuery.trim().toLowerCase();
  let body;
  if(q){
    const arts=S.articles.filter(a=>[a.title,a.sum,a.tags,catName(a.cat),...(a.steps||[]).flatMap(s=>[s.t,s.d]),...(a.hints||[])].join(" ").toLowerCase().includes(q));
    const gl=S.glossary.filter(x=>[x.term,x.long,x.desc].join(" ").toLowerCase().includes(q));
    const docs=S.docs.filter(d=>[d.title,d.note,docCatName(d.cat)].join(" ").toLowerCase().includes(q));
    body=(arts.length?`<div class="list">${arts.map(articleRow).join("")}</div>`:"")+
      (docs.length?`<h3 style="margin-top:6px">In Unterlagen</h3><div class="grid2">${docs.map(docCard).join("")}</div>`:"")+
      (gl.length?`<h3 style="margin-top:6px">Im Glossar</h3><div class="list">${gl.map(glRow).join("")}</div>`:"")+
      (!arts.length&&!gl.length&&!docs.length?`<div class="list"><div class="empty">Nichts gefunden zu „${esc(wissenQuery)}“. Versuch einen anderen Begriff, z. B. „KVz“ oder „Messung“.</div></div>`:"");
  } else if(wissenFilter==="glossar"){
    body=S.glossary.length?`<div class="list">${[...S.glossary].sort((a,b)=>String(a.term).localeCompare(String(b.term),"de")).map(glRow).join("")}</div>`:`<div class="list"><div class="empty">Noch keine Begriffe angelegt.</div></div>`;
  } else {
    const list=S.articles.filter(a=>wissenFilter==="alle"||a.cat===wissenFilter);
    body=list.length?`<div class="list">${list.map(articleRow).join("")}</div>`:`<div class="list"><div class="empty">In dieser Kategorie gibt es noch keine Anleitungen.</div></div>`;
  }
  return `<div class="sec"><h1>Wissen</h1>
    ${searchBox("q","Suchen in Anleitungen, Unterlagen und Glossar",wissenQuery)}
    <div class="filters" role="group" aria-label="Kategorie">
      <button data-wf="alle" aria-pressed="${wissenFilter==="alle"}">Alle</button>
      ${S.settings.cats.map(c=>`<button data-wf="${c.id}" aria-pressed="${wissenFilter===c.id}">${esc(c.name)}</button>`).join("")}
      <button data-wf="glossar" aria-pressed="${wissenFilter==="glossar"}">Glossar</button>
    </div></div>
    <div class="sec">${body}</div>`;
}

function vArticle(a){
  if(!a) return `<div class="list"><div class="empty">Diese Anleitung gibt es nicht mehr.</div></div>`;
  const steps=a.steps||[], vals=(a.values||[]).filter(v=>v.k), hints=(a.hints||[]).filter(Boolean), imgs=a.images||[];
  return `<div class="sec"><span class="chip c" style="align-self:flex-start">${esc(catName(a.cat))}</span><h1>${esc(a.title)}</h1>${a.sum?`<p class="muted">${esc(a.sum)}</p>`:""}</div>
  ${steps.length?`<div class="sec"><h2>Vorgehen</h2><ol class="steps">${steps.map(s=>`<li><b>${esc(s.t)}</b><span class="muted">${esc(s.d)}</span></li>`).join("")}</ol></div>`:""}
  ${imgs.length?`<div class="sec"><h2>Bilder</h2><div class="gallery">${imgs.map(id=>`<button data-zoom="${id}" data-cap="${esc(a.title)}"><img src="${blob(id)}" alt="Bild zu ${esc(a.title)}" loading="lazy"></button>`).join("")}</div></div>`:""}
  ${vals.length?`<div class="sec"><h2>Richtwerte</h2><div class="list">${vals.map(v=>`<div class="row vrow"><div class="t"><b>${esc(v.k)}</b></div><span class="val">${esc(v.v)}</span></div>`).join("")}</div></div>`:""}
  ${hints.length?`<div class="sec"><div class="box warn"><h3>Wichtig</h3><ul>${hints.map(h=>`<li>${esc(h)}</li>`).join("")}</ul></div></div>`:""}`;
}

function vUnterlagen(){
  const g=stateGate(); if(g) return `<div class="sec"><h1>Unterlagen</h1>${g}</div>`;
  const q=docQuery.trim().toLowerCase();
  const list=S.docs.filter(d=>(docFilter==="alle"||d.cat===docFilter)&&(!q||[d.title,d.note,docCatName(d.cat)].join(" ").toLowerCase().includes(q)));
  return `<div class="sec"><h1>Unterlagen</h1><p class="muted">Schulungsunterlagen, Zählweisen, Schaltweisen und Bilder von KVz, MFG, HVt und APL.</p>
    ${searchBox("qd","Unterlagen durchsuchen",docQuery)}
    <div class="filters" role="group" aria-label="Kategorie">
      <button data-df="alle" aria-pressed="${docFilter==="alle"}">Alle</button>
      ${S.settings.docCats.map(c=>`<button data-df="${c.id}" aria-pressed="${docFilter===c.id}">${esc(c.name)}</button>`).join("")}
    </div></div>
    <div class="sec">${list.length?`<div class="grid2">${list.map(docCard).join("")}</div>`
      :`<div class="list"><div class="empty">${S.docs.length?"Keine Unterlagen in dieser Auswahl.":"Noch keine Unterlagen hochgeladen."+(S.canEdit?" Über „Verwaltung“ kannst du PDFs und Bilder hinzufügen.":"")}</div></div>`}</div>`;
}

function vChecklists(){
  const g=stateGate(); if(g) return `<div class="sec"><h1>Checklisten</h1>${g}</div>`;
  return `<div class="sec"><h1>Checklisten</h1><p class="muted">Zum Abhaken vor Ort. Dein Stand wird für dich gespeichert.</p></div>
  <div class="sec">${S.checklists.length?`<div class="list">${S.checklists.map(c=>{const items=c.items||[];const n=items.filter(i=>clDone(c.id).includes(i)).length;
    return `<button class="row" data-open="cl:${c.id}"><div class="t"><b>${esc(c.title)}</b><span>${esc(c.sum)}</span></div><span class="chip ${n===items.length&&n?"ok":""}">${n}/${items.length}</span>${chev}</button>`}).join("")}</div>`
    :`<div class="list"><div class="empty">Noch keine Checklisten angelegt.</div></div>`}</div>`;
}
function vChecklist(c){
  if(!c) return `<div class="list"><div class="empty">Diese Checkliste gibt es nicht mehr.</div></div>`;
  const items=c.items||[], d=clDone(c.id), n=items.filter(i=>d.includes(i)).length;
  return `<div class="sec"><div class="eyebrow">Checkliste</div><h1>${esc(c.title)}</h1>
    <div style="display:flex;align-items:center;gap:12px"><div class="bar" style="flex:1"><i style="width:${items.length?n/items.length*100:0}%"></i></div><span class="val">${n}/${items.length}</span></div></div>
  <div class="sec"><div class="list">${items.map((it,i)=>`<label class="check ${d.includes(it)?"done":""}"><input type="checkbox" id="cl-${c.id}-${i}" data-cl="${c.id}" data-i="${i}" ${d.includes(it)?"checked":""}><span>${esc(it)}</span></label>`).join("")}</div>
  ${n===items.length&&n?`<div class="fb ok"><b>Alles erledigt.</b>Du kannst weitermachen.</div>`:""}
  <div class="actions"><button class="btn ghost" data-reset="${c.id}">Zurücksetzen</button></div></div>`;
}

function vSchulung(){
  const g=stateGate(); if(g) return `<div class="sec"><h1>Schulung</h1>${g}</div>`;
  return `<div class="sec"><h1>Schulung</h1><p class="muted">Kurze Lektionen für zu Hause. Jede endet mit ein paar Multiple-Choice-Fragen.</p></div>
  <div class="sec">${S.courses.length?`<div class="list">${S.courses.map(c=>{const r=courseResult(c.id);
    return `<button class="row" data-open="course:${c.id}"><div class="t"><b>${esc(c.title)}</b><span>${(c.qs||[]).length} Fragen · ca. ${esc(c.min||5)} Min</span></div>${r?`<span class="chip ok">${r.score}/${r.total}</span>`:`<span class="chip">offen</span>`}${chev}</button>`}).join("")}</div>`
    :`<div class="list"><div class="empty">Noch keine Lektionen angelegt.</div></div>`}</div>`;
}
function vCourse(c){
  if(!c) return `<div class="list"><div class="empty">Diese Lektion gibt es nicht mehr.</div></div>`;
  const qs=(c.qs||[]).filter(q=>q.q&&(q.o||[]).filter(Boolean).length>=2);
  if(!quiz||quiz.id!==c.id) return `<div class="sec"><div class="eyebrow">Lektion · ca. ${esc(c.min||5)} Min</div><h1>${esc(c.title)}</h1><p>${esc(c.intro)}</p>
    <p class="muted">${qs.length} Fragen. Nach jeder Antwort siehst du direkt die Erklärung.</p>
    <div class="actions"><button class="btn" data-start="${c.id}" ${qs.length?"":"disabled"}>Fragen starten</button></div></div>`;
  if(quiz.i>=qs.length){
    const pass=quiz.score/qs.length>=0.7;
    return `<div class="sec"><div class="eyebrow">Ergebnis</div><h1>${esc(c.title)}</h1>
      <div class="hero"><div class="score">${quiz.score}<span class="muted" style="font-size:28px"> / ${qs.length}</span></div>
      <div class="fb ${pass?"ok":"no"}"><b>${pass?"Bestanden.":"Noch nicht ganz."}</b>${pass?"Die Lektion ist als abgeschlossen markiert.":"Schau dir die Anleitungen im Wissen-Bereich nochmal an und versuch es erneut."}</div></div>
      <div class="actions"><button class="btn" data-start="${c.id}">Nochmal</button><a class="btn ghost" href="#schulung" data-home>Zur Übersicht</a></div></div>`;
  }
  const q=qs[quiz.i], ans=quiz.ans, opts=q.o.map((o,i)=>({o,i})).filter(x=>x.o);
  return `<div class="sec"><div class="between"><span class="eyebrow">${esc(c.title)}</span><span class="val">${quiz.i+1}/${qs.length}</span></div>
    <div class="bar"><i style="width:${quiz.i/qs.length*100}%"></i></div>
    <h2 style="margin-top:6px">${esc(q.q)}</h2>
    <div class="stack">${opts.map(({o,i})=>{let cls="";if(ans!=null){if(i===+q.c)cls="right";else if(i===ans)cls="wrong"}
      return `<button class="opt ${cls}" data-ans="${i}" ${ans!=null?"disabled":""}>${esc(o)}</button>`}).join("")}</div>
    ${ans!=null?`<div class="fb ${ans===+q.c?"ok":"no"}"><b>${ans===+q.c?"Richtig.":"Leider falsch."}</b>${esc(q.w)}</div>
      <div class="actions"><button class="btn" data-next>${quiz.i+1<qs.length?"Nächste Frage":"Ergebnis ansehen"}</button></div>`:""}
  </div>`;
}

function setPath(obj,path,val){const p=path.split(".");let o=obj;for(let i=0;i<p.length-1;i++)o=o[isNaN(p[i])?p[i]:+p[i]];o[isNaN(p.at(-1))?p.at(-1):+p.at(-1)]=val}

let sbClient=null;
async function uploadFiles(files,key){
  if(!CAP.assets) return;
  for(const file of files){
    if(file.size>50*1048576){toast(file.name+" ist größer als 50 MB.",1);continue}
    toast("Lade „"+file.name+"“ hoch …");
    try{
      const t=await api("/api/admin/upload",{method:"POST",body:{name:file.name,type:file.type}});
      if(!sbClient)sbClient=window.supabase.createClient(t.url,t.anonKey);
      const {error}=await sbClient.storage.from(t.bucket).uploadToSignedUrl(t.path,t.token,file,{contentType:file.type});
      if(error) throw new Error("Upload fehlgeschlagen. Bitte nochmal versuchen.");
      draft._added.push(t.path);
      try{Object.assign(S.files,await api("/api/files",{method:"POST",body:{paths:[t.path]}}))}catch(e){}
      if(key==="images") draft.images.push(t.path);
      else if(key==="thumb"){ (draft.images||[]).forEach(p=>draft._removed.push(p)); draft.images=[t.path]; }
      else { if(draft.asset) draft._removed.push(draft.asset); draft.asset=t.path;draft.type=file.type;draft.size=file.size; if(!draft.title) draft.title=file.name.replace(/\.[^.]+$/,""); }
    }catch(e){toast(e.message,1)}
  }
  render();
}

  if(t==="verwaltung"&&!detail) detail={type:"admin"};

    if(detail.type==="art")html=vArticle(S.articles.find(a=>a.id===detail.id));
    else if(detail.type==="cl")html=vChecklist(S.checklists.find(c=>c.id===detail.id));
    else if(detail.type==="course")html=vCourse(S.courses.find(c=>c.id===detail.id));
    else if(detail.type==="admin")html=vAdmin();
    else if(detail.type==="edit")html=vEdit();
  } else html={start:vStart,wissen:vWissen,unterlagen:vUnterlagen,checklisten:vChecklists,schulung:vSchulung}[t]();
  $app.innerHTML=html;
  if(aid){const n=document.getElementById(aid);if(n){n.focus({preventScroll:true});if(sel&&n.setSelectionRange)try{n.setSelectionRange(sel[0],sel[1])}catch(e){}}}
}
function goBack(){
  if(detail?.type==="edit"){deleteAssets(draft?._added||[]);draft=null;detail={type:"admin"}}
  else if(detail?.type==="admin"){detail=null;if(tab()==="verwaltung"){location.hash="start";return}}
  else {detail=null;quiz=null}
  render();scrollTo(0,0);
}
$back.onclick=goBack;
let logoTaps=[];
document.querySelector(".logo").addEventListener("click",()=>{
  const now=Date.now();logoTaps=logoTaps.filter(t=>now-t<3000);logoTaps.push(now);
  if(logoTaps.length>=5){logoTaps=[];session.set("");S.me=null;S.canEdit=false;CAP.assets=false;S.users=[];detail=null;quiz=null;draft=null;
    loginStep={email:loginStep.email||"",admin:true,busy:false,err:""};S.state="login";render();setTimeout(()=>document.getElementById("lg-email")?.focus(),50)}
});
$adminBtn.onclick=()=>{detail={type:"admin"};render();scrollTo(0,0)};
window.addEventListener("hashchange",()=>{if(detail?.type==="edit")deleteAssets(draft?._added||[]);detail=null;quiz=null;draft=null;render();scrollTo(0,0)});

/* ============ Events ============ */
document.addEventListener("submit",async e=>{
  if(e.target.id==="loginForm"){e.preventDefault();
    const email=document.getElementById("lg-email").value.trim();const pw=document.getElementById("lg-pw")?.value;
    if(!email){loginStep={...loginStep,err:"Bitte deine E-Mail-Adresse eingeben."};render();return}
    if(loginStep.admin&&!pw){loginStep={...loginStep,email,err:"Bitte das Admin-Passwort eingeben."};render();return}
    doLogin(email,loginStep.admin?pw:undefined);return}
  if(e.target.id==="userForm"){e.preventDefault();
    const email=document.getElementById("nu-email").value.trim(),name=document.getElementById("nu-name").value.trim(),admin=document.getElementById("nu-admin").checked;
    if(!email){toast("Bitte eine E-Mail-Adresse eingeben.",1);return}
    try{await api("/api/admin/users",{method:"POST",body:{email,name,role:admin?"admin":"user"}});toast("Zugang für "+email+" angelegt");loadUsers()}catch(err){toast(err.message,1)}
  }
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="q"){wissenQuery=el.value;render();return}
  if(el.id==="qd"){docQuery=el.value;render();return}
  if(!draft) return;
  if(el.dataset.lines){setPath(draft,el.dataset.lines,el.value.split("\n"));return}
  if(el.dataset.f&&el.type!=="checkbox"&&el.type!=="radio") setPath(draft,el.dataset.f,el.type==="number"?+el.value:el.value);
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(draft&&el.dataset.f&&(el.type==="checkbox"||el.type==="radio")){setPath(draft,el.dataset.f,el.type==="checkbox"?el.checked:+el.value);return}
  if(draft&&el.tagName==="SELECT"&&el.dataset.f){setPath(draft,el.dataset.f,el.value);return}
  if(el.dataset.upload){uploadFiles([...el.files],el.dataset.upload);el.value="";return}
  const cb=el.closest("[data-cl]");
  if(cb){const c=S.checklists.find(x=>x.id===cb.dataset.cl);const item=c.items[+cb.dataset.i];
    const set=new Set(clDone(c.id));cb.checked?set.add(item):set.delete(item);S.progress.cl[c.id]=[...set];saveProgress();render()}
});
document.addEventListener("keydown",e=>{
  if(e.target.id==="q-start"&&e.key==="Enter"){wissenQuery=e.target.value;wissenFilter="alle";location.hash="wissen"}
  if(e.key==="Enter"&&e.target.matches(".adminrow .t,.upl")){e.preventDefault();e.target.click()}
  if(e.key==="Escape"&&$ov.innerHTML)$ov.innerHTML="";
});
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-open],[data-cat],[data-wf],[data-df],[data-start],[data-ans],[data-next],[data-reset],[data-zoom],[data-new],[data-edit],[data-editcats],[data-move],[data-aadd],[data-arm],[data-amove],[data-rmimg],[data-save],[data-cancel],[data-del],[data-home],[data-logout],[data-utoggle],[data-urole],[data-udel],[data-qdel],[data-normallogin],[data-install],.lightbox");
  if(!el) return;
  const ds=el.dataset;
  if(el.classList.contains("lightbox")){$ov.innerHTML="";return}
  if(ds.open){const [t,id]=ds.open.split(":");quiz=null;detail={type:t,id};render();scrollTo(0,0)}
  else if(ds.cat){wissenFilter=ds.cat;wissenQuery="";detail=null;if(tab()==="wissen")render();else location.hash="wissen"}
  else if(ds.wf){wissenFilter=ds.wf;wissenQuery="";render()}
  else if(ds.df){docFilter=ds.df;render()}
  else if(ds.home!=null){detail=null;quiz=null;if(tab()==="schulung"){e.preventDefault();render();scrollTo(0,0)}}
  else if(ds.zoom){$ov.innerHTML=`<div class="lightbox" role="dialog" aria-label="Bild"><img src="${blob(ds.zoom)}" alt="${esc(ds.cap)}"><p>${esc(ds.cap)} · Tippen zum Schließen</p></div>`}
  else if(ds.start){quiz={id:ds.start,i:0,score:0,ans:null};render()}
  else if(ds.ans!=null&&quiz&&quiz.ans==null){const c=S.courses.find(x=>x.id===quiz.id);const qs=c.qs.filter(q=>q.q&&(q.o||[]).filter(Boolean).length>=2);quiz.ans=+ds.ans;if(quiz.ans===+qs[quiz.i].c)quiz.score++;render()}
  else if(ds.next!=null){const c=S.courses.find(x=>x.id===quiz.id);const qs=c.qs.filter(q=>q.q&&(q.o||[]).filter(Boolean).length>=2);quiz.i++;quiz.ans=null;
    if(quiz.i>=qs.length){const prev=courseResult(c.id);if(quiz.score/qs.length>=0.7&&(!prev||quiz.score>=prev.score)){S.progress.courses[c.id]={score:quiz.score,total:qs.length};saveProgress()}}
    render();scrollTo(0,0)}
  else if(ds.reset){S.progress.cl[ds.reset]=[];saveProgress();render()}
  /* Verwaltung */
  else if(ds.new){openEditor(ds.new)}
  else if(ds.edit){const [c,id]=ds.edit.split(":");openEditor(c,id)}
  else if(ds.editcats!=null){draft=JSON.parse(JSON.stringify(S.settings));draft._col="settings";draft._added=[];draft._removed=[];detail={type:"edit"};render();scrollTo(0,0)}
  else if(ds.move){const [c,i,d]=ds.move.split(":");moveItem(c,+i,+d)}
  else if(ds.aadd){(draft[ds.aadd]=draft[ds.aadd]||[]).push(ROW[ds.aadd]());render()}
  else if(ds.arm){const [a,i]=ds.arm.split(":");draft[a].splice(+i,1);render()}
  else if(ds.amove){const [a,i,d]=ds.amove.split(":");const arr=draft[a],x=+i,y=x+ +d;if(arr[y]){[arr[x],arr[y]]=[arr[y],arr[x]];render()}}
  else if(ds.rmimg){const id=draft.images.splice(+ds.rmimg,1)[0];draft._removed.push(id);render()}
  else if(ds.save!=null){saveDraft()}
  else if(ds.cancel!=null){deleteAssets(draft._added);closeEditor()}
  else if(ds.del){if(ds.del==="1")deleteDraft();else{draft._confirmDel=true;render()}}
  else if(ds.logout!=null){doLogout()}
  else if(ds.install!=null&&installPrompt){installPrompt.prompt();installPrompt.userChoice.finally(()=>{installPrompt=null;render()})}
  else if(ds.normallogin!=null){e.preventDefault();loginStep={email:loginStep.email,admin:false,busy:false,err:""};render()}
  else if(ds.qdel){if(ds.c==="1"){qdel=null;quickDelete(...ds.qdel.split(":"))}else{qdel=ds.qdel;render()}}
  else if(ds.utoggle){api("/api/admin/users",{method:"PATCH",body:{email:ds.utoggle,active:ds.v==="1"}}).then(()=>{toast(ds.v==="1"?"Zugang freigegeben":"Zugang gesperrt");loadUsers()}).catch(err=>toast(err.message,1))}
  else if(ds.urole){api("/api/admin/users",{method:"PATCH",body:{email:ds.urole,role:ds.v}}).then(()=>{toast(ds.v==="admin"?"Ist jetzt Admin":"Admin-Rechte entfernt");loadUsers()}).catch(err=>toast(err.message,1))}
  else if(ds.udel){if(ds.c==="1"){udel=null;api("/api/admin/users",{method:"DELETE",body:{email:ds.udel}}).then(()=>{toast("Zugang entfernt");loadUsers()}).catch(err=>toast(err.message,1))}else{udel=ds.udel;render()}}
});

/* ============ Als App installieren ============ */
let installPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;softRender()});
window.addEventListener("appinstalled",()=>{installPrompt=null;toast("App installiert");softRender()});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

init();
</script>
